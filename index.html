<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1>Notes</h1>
    <div class="topbar-actions">
      <button id="new-folder-btn" type="button">New folder</button>
      <button id="new-note-btn" type="button">New note</button>
      <button id="new-reminder-btn" type="button">New reminder</button>
      <button id="backup-btn" type="button">Backup</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="panel folders-panel" aria-label="Folders">
      <div class="panel-title">Folders</div>
      <div id="folder-tree" class="folder-tree">
        <p class="muted">No folders yet.</p>
      </div>
    </aside>

    <section class="panel items-panel" aria-label="Items">
      <div class="tabbar" role="tablist">
        <button id="notes-tab" class="tab active" type="button" role="tab">Notes</button>
        <button id="reminders-tab" class="tab" type="button" role="tab">Reminders</button>
      </div>
      <div id="item-list" class="item-list">
        <p class="muted">Create your first note or reminder.</p>
      </div>
    </section>

    <section class="panel editor-panel" aria-label="Editor">
      <div id="empty-editor" class="empty-editor">
        <h2>Local-first notes</h2>
        <p>Select an item to edit it.</p>
      </div>

      <form id="note-editor" class="editor hidden">
        <input id="note-title" class="title-input" type="text" placeholder="Title" autocomplete="off">
        <textarea id="note-body" class="body-input" placeholder="Write a note..."></textarea>
        <div class="editor-actions">
          <button id="add-media-btn" type="button">Add photo/video</button>
          <button id="save-note-btn" type="submit">Save</button>
        </div>
        <input id="media-input" type="file" accept="image/*,video/*" multiple hidden>
      </form>

      <form id="reminder-editor" class="editor hidden">
        <input id="reminder-title" class="title-input" type="text" placeholder="Reminder">
        <textarea id="reminder-body" class="body-input short" placeholder="Details"></textarea>
        <div class="form-grid">
          <label>
            First due
            <input id="reminder-start" type="datetime-local">
          </label>
          <label>
            Repeat
            <select id="reminder-repeat">
              <option value="once">Once</option>
              <option value="daily">Every N days</option>
              <option value="weekly">Weekly / selected weekdays</option>
              <option value="monthly">Every N months</option>
              <option value="yearly">Every N years</option>
            </select>
          </label>
          <label>
            Interval
            <input id="reminder-interval" type="number" min="1" value="1">
          </label>
          <fieldset id="weekday-picker" class="weekday-picker hidden">
            <legend>Weekdays</legend>
            <label><input type="checkbox" value="1"> Mon</label>
            <label><input type="checkbox" value="2"> Tue</label>
            <label><input type="checkbox" value="3"> Wed</label>
            <label><input type="checkbox" value="4"> Thu</label>
            <label><input type="checkbox" value="5"> Fri</label>
            <label><input type="checkbox" value="6"> Sat</label>
            <label><input type="checkbox" value="0"> Sun</label>
          </fieldset>
        </div>
        <div class="editor-actions">
          <button id="save-reminder-btn" type="submit">Save reminder</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="statusbar">
    <span id="storage-status">Local storage: checking…</span>
    <span id="reminder-status">Reminder engine: idle</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
