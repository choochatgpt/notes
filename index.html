<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body data-kind="notes" data-mode="browse">

  <!-- Single definition for every glyph in the app. Stroke and fill are inherited
       from the .icon class so the symbols below carry no paint attributes. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      <path d="M14 3v5h5"/><path d="M9.5 13h5M9.5 16.5h3"/>
    </symbol>
    <symbol id="i-note-plus" viewBox="0 0 24 24">
      <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      <path d="M14 3v5h5"/><path d="M12 12.5v5M9.5 15h5"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/>
    </symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24">
      <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/>
      <path d="M11 12.5v5M8.5 15h5"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 15.5V11a6 6 0 1 0-12 0v4.5L4.5 18h15z"/>
      <path d="M10 21a2 2 0 0 0 4 0"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/>
      <path d="M6.5 7l1 12.5h9L17.5 7"/><path d="M10 11v5M14 11v5"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="14" rx="1.5"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M4.5 17l4.5-4.5 3 3 3.5-3.5 4 4"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon"><use href="#i-note"></use></svg>
      </span>
      <h1>Notes</h1>
    </div>

    <!-- One row, never wraps. Below 760px the labels collapse and the icons carry
         the meaning, with title/aria-label kept for pointer and screen readers. -->
    <div class="topbar-actions" role="group" aria-label="Actions">
      <button id="new-folder-btn" class="btn" type="button" title="New folder" aria-label="New folder">
        <svg class="icon"><use href="#i-folder-plus"></use></svg><span>New folder</span>
      </button>
      <button id="new-note-btn" class="btn primary" type="button" title="New note" aria-label="New note">
        <svg class="icon"><use href="#i-note-plus"></use></svg><span>New note</span>
      </button>
      <button id="new-reminder-btn" class="btn" type="button" title="New reminder" aria-label="New reminder">
        <svg class="icon"><use href="#i-bell"></use></svg><span>New reminder</span>
      </button>
      <button id="settings-btn" class="btn ghost" type="button" title="Settings" aria-label="Settings">
        <svg class="icon"><use href="#i-gear"></use></svg><span>Settings</span>
      </button>
    </div>
  </header>

  <main class="app-shell">

    <!-- Upper half: browse or edit. The editor replaces the browser in place and
         a back arrow returns, so the reminder agenda below never scrolls away. -->
    <section class="pane" aria-label="Notes and reminders">
      <div class="panel-head">
        <button id="editor-back" class="icon-btn hidden" type="button" title="Back" aria-label="Back to the list">
          <svg class="icon"><use href="#i-back"></use></svg>
        </button>

        <div class="tabbar" role="tablist">
          <button id="notes-tab" class="tab active" type="button" role="tab" aria-selected="true">Notes</button>
          <button id="reminders-tab" class="tab" type="button" role="tab" aria-selected="false">Reminders</button>
        </div>

        <span id="list-context" class="context-chip"></span>
      </div>

      <div class="pane-body">
        <!-- Notes browser: folder tree beside the note list. -->
        <div id="browse-notes" class="browse browse-notes">
          <div class="folders-col">
            <div class="col-head">
              <span class="panel-title">Folders</span>
              <button id="add-folder-inline" class="icon-btn" type="button" title="New folder" aria-label="New folder">
                <svg class="icon"><use href="#i-folder-plus"></use></svg>
              </button>
            </div>

            <form id="new-folder-form" class="inline-form hidden" autocomplete="off">
              <input id="new-folder-name" type="text" placeholder="Folder name" aria-label="Folder name">
              <button class="btn small primary" type="submit">Add</button>
            </form>

            <div id="folder-tree" class="folder-tree"></div>
          </div>

          <div class="list-col">
            <div id="note-list" class="item-list"></div>
          </div>
        </div>

        <!-- Reminders manager: where reminders are created, edited and deleted.
             The always-visible agenda below is read-only, so this is the only
             place a reminder can be changed. -->
        <div id="browse-reminders" class="browse hidden">
          <div id="reminder-manage-list" class="item-list"></div>
        </div>

        <!-- Editors, shown in place of whichever browser is active. -->
        <div id="editor-host" class="editor-host hidden">
          <form id="note-editor" class="editor hidden">
            <input id="note-title" class="title-input" type="text" placeholder="Title" autocomplete="off">
            <!-- Where the note lives. Changing this and saving moves the note,
                 which is the only way a note changes folder. -->
            <div class="form-grid">
              <label>
                Folder
                <select id="note-folder"></select>
              </label>
            </div>
            <textarea id="note-body" class="body-input" placeholder="Write a note..."></textarea>
            <!-- Attached photos/videos. Thumbnails render here; the full bytes
                 stay in this device's OPFS and are never backed up. -->
            <div id="media-strip" class="media-strip hidden"></div>
            <div class="editor-actions">
              <button id="delete-note-btn" class="btn danger" type="button">
                <svg class="icon"><use href="#i-trash"></use></svg><span>Delete</span>
              </button>
              <button id="add-media-btn" class="btn" type="button">
                <svg class="icon"><use href="#i-image"></use></svg><span>Add photo/video</span>
              </button>
              <button id="save-note-btn" class="btn primary" type="submit">Save</button>
            </div>
            <input id="media-input" type="file" accept="image/*,video/*" multiple hidden>
          </form>

          <form id="reminder-editor" class="editor hidden">
            <input id="reminder-title" class="title-input" type="text" placeholder="Reminder">
            <textarea id="reminder-body" class="body-input short" placeholder="Details"></textarea>
            <div class="form-grid">
              <label>
                First due
                <input id="reminder-start" type="datetime-local">
              </label>
              <label>
                Repeat
                <select id="reminder-repeat">
                  <option value="once">Once</option>
                  <option value="daily">Every N days</option>
                  <option value="weekly">Weekly / selected weekdays</option>
                  <option value="monthly">Every N months</option>
                  <option value="yearly">Every N years</option>
                </select>
              </label>
              <label>
                Interval
                <input id="reminder-interval" type="number" min="1" value="1">
              </label>
              <fieldset id="weekday-picker" class="weekday-picker hidden">
                <legend>Weekdays</legend>
                <label><input type="checkbox" value="1"> Mon</label>
                <label><input type="checkbox" value="2"> Tue</label>
                <label><input type="checkbox" value="3"> Wed</label>
                <label><input type="checkbox" value="4"> Thu</label>
                <label><input type="checkbox" value="5"> Fri</label>
                <label><input type="checkbox" value="6"> Sat</label>
                <label><input type="checkbox" value="0"> Sun</label>
              </fieldset>
            </div>
            <div class="editor-actions">
              <button id="delete-reminder-btn" class="btn danger" type="button">
                <svg class="icon"><use href="#i-trash"></use></svg><span>Delete</span>
              </button>
              <button id="save-reminder-btn" class="btn primary" type="submit">Save reminder</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Lower half: the agenda. Read-only and always visible while you work
         above, soonest reminder first. -->
    <section class="pane pane-agenda" aria-label="Upcoming reminders">
      <div class="panel-head">
        <span class="panel-title">Upcoming reminders</span>
        <span id="agenda-context" class="context-chip"></span>
      </div>
      <div class="pane-body">
        <div id="agenda-list" class="item-list"></div>
      </div>
    </section>
  </main>

  <!-- Settings: the pane ratio, plus the text-only CSV backup pair. It is one
       native <dialog> so Escape and the backdrop behave the way users expect,
       and every control inside is type="button" -- nothing here submits. -->
  <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title" class="dialog-title">Settings</h2>
      <button id="settings-close" class="btn small" type="button">Close</button>
    </div>

    <!-- Cycles the upper/lower pane split: 1:4, 1:3, 1:2, 2:3, 3:4, then the
         default 1:1, and around again. The chip shows where you are. -->
    <div class="dialog-row">
      <button id="ratio-btn" class="btn" type="button"
              aria-label="Notes/Reminders panel display ratio">
        Notes/Reminders panel display ratio
        <span id="ratio-value" class="chip accent">50%</span>
      </button>
    </div>

    <div class="dialog-actions">
      <button id="export-btn" class="btn primary" type="button">Export notes/reminders to email</button>
      <button id="import-btn" class="btn" type="button">Import notes/reminders</button>
    </div>

    <!-- Export: the CSV is shown in full so the user can see exactly what leaves
         the device. Two ways out, both named for what they do: Copy CSV puts the
         text on the clipboard (the relay-inbox path starts here), and Export CSV
         opens the entered address in the user's own mail app with the backup as
         the draft body. Download and Share were removed (2026-10-01): a saved
         file still needed a manual attach step and the phone's share sheet had
         already refused once in the wild, while copy + mailto covered every
         route the two of them served. -->
    <section id="export-panel" class="dialog-panel hidden">
      <label class="dialog-field">
        Email address
        <input id="backup-email" type="email" placeholder="you@example.com" autocomplete="off">
      </label>
      <textarea id="export-csv" class="csv-box" readonly spellcheck="false"
                aria-label="Backup CSV"></textarea>
      <p id="export-size-note" class="muted"></p>
      <div class="dialog-actions">
        <button id="copy-csv-btn" class="btn small" type="button">Copy CSV</button>
        <a id="open-email-btn" class="btn small primary" href="#">Export CSV</a>
      </div>
    </section>

    <!-- Import: paste, preview, then a separate confirmed restore. The restore
         button stays disabled until the pasted text itself has been previewed,
         so a stale preview can never authorise a newer paste. -->
    <section id="import-panel" class="dialog-panel hidden">
      <p class="muted">Paste the whole backup CSV from your email, then preview it before restoring.</p>
      <textarea id="restore-input" class="csv-box" spellcheck="false"
                placeholder="# notes-backup v1 ..." aria-label="Backup CSV to restore"></textarea>
      <div id="preview-out" class="preview-out" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="preview-btn" class="btn small" type="button">Preview import</button>
        <button id="restore-btn" class="btn small danger" type="button" disabled>Restore (overwrite all)</button>
      </div>
    </section>

    <!-- The visible release number (the user asked for it): if this ever
         disagrees with sw.js's cache name, static_check.py fails the build. -->
    <p class="dialog-version">Version <span id="app-version"></span></p>
  </dialog>

  <!-- Photo/video viewer. The bytes never leave the device: the dialog shows
         the OPFS copy through an object URL, and closing revokes it. -->
  <dialog id="media-dialog" class="media-dialog" aria-label="Attached photo">
    <div class="dialog-head">
      <span class="panel-title">Attached media</span>
      <button id="media-close" class="btn small" type="button">Close</button>
    </div>
    <img id="media-view" class="media-view hidden" alt="">
    <video id="media-video" class="media-view hidden" controls playsinline></video>
  </dialog>

  <!-- The status bar carries failures only, and takes no space when there are
       none. It used to hold two informational lines -- local storage usage, and
       the next reminder -- and both were removed: the agenda directly above
       already shows what is coming up, and the storage figure answered a
       question nobody was asking.

       The element itself stays, because a startup failure has to be impossible
       to miss. The app looks fully usable when it cannot start, so without this
       the symptom is "every button is broken" with nothing on screen to explain
       it -- which is exactly the outage this project already had. -->
  <footer class="statusbar" hidden>
    <span id="app-status"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
